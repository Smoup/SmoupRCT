# Централизованные свойства Stonecutter.
# Общие ключи — сверху, версионно-специфичные — в секциях [<версия>].
# Док: https://stonecutter.kikugie.dev/wiki/config/properties

mod.id = "smouprct"
mod.name = "SmoupRCT"
mod.version = "1.0.5"

# deps.fabric_loader — на чём собираем и запускаем dev-клиент.
# mod.min_loader — что попадает в depends мода: минимум, который требует Fabric API
# соответствующей ветки. Разведены, чтобы сборка шла на свежем лоадере,
# а игроку не навязывалась версия выше необходимой.
deps.fabric_loader = "0.16.6"
mod.min_loader = "0.15.6"
loomx.loom_version = "1.17-SNAPSHOT"

# Публикация на Modrinth (см. publishMods в build.gradle.kts).
# Неизменяемый project ID (slug 'smouprct' тоже сработал бы, но ID не ломается при переименовании).
# Токен берётся из env MODRINTH_TOKEN.
publish.modrinth_id = "DLhkGcwz"

